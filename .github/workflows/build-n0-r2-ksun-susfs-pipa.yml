name: Build N0Kernel r2 (KSUN v3.1.0-legacy + KPM-ready, No SUSFS) for Xiaomi Pad 6 (pipa)

on:
  workflow_dispatch:
    inputs:
      ksun_tag:
        description: "KernelSU-Next tag (default: v3.1.0-legacy)"
        required: false
        default: "v3.1.0-legacy"
      publish_release:
        description: "Publish GitHub Release r2-ksun-kpm-v1"
        required: false
        default: "true"
      repack_only:
        description: "Fast repack existing r2-ksun-kpm-v1 Image.gz with updated anykernel.sh"
        required: false
        default: "false"
        
permissions:
  contents: write

jobs:
  build-n0-r2-ksun-kpm:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - if: ${{ github.event.inputs.repack_only != 'true' }}
        name: Clone N0Kernel r1 base & strip old KernelSU
        run: |
          git clone --depth=1 --branch r1 https://github.com/CuriousNom/n0_kernel_pipa.git kernel
          cd kernel
          R1_COMMIT="$(git rev-parse HEAD)"
          echo "R1_COMMIT=${R1_COMMIT}" >> "$GITHUB_ENV"
          echo "Base N0Kernel r1 commit: ${R1_COMMIT}"
          rm -rf KernelSU KernelSU-Next drivers/kernelsu
          git status -s

      - name: Integrate official KernelSU-Next v3.1.0-legacy (NO SUSFS)
        if: ${{ github.event.inputs.repack_only != 'true' }}
        run: |
          set -euo pipefail
          cd kernel
          KSUN_TAG="${{ github.event.inputs.ksun_tag || 'v3.1.0-legacy' }}"
          git clone --depth=1 --branch "${KSUN_TAG}" https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          KSUN_COMMIT="$(git -C KernelSU-Next rev-parse HEAD)"
          echo "KSUN_TAG=${KSUN_TAG}" >> "$GITHUB_ENV"
          echo "KSUN_COMMIT=${KSUN_COMMIT}" >> "$GITHUB_ENV"
          echo "Integrated KernelSU-Next: ${KSUN_TAG} (${KSUN_COMMIT})"

          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          if ! grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi
          if ! grep -q 'kernelsu' drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi

      - name: Wire KSUN manual hooks & KPM-ready defconfig (Zero SUSFS)
        if: ${{ github.event.inputs.repack_only != 'true' }}
        run: |
          set -euo pipefail
          cd kernel
          python3 -c 'import textwrap, sys; exec(textwrap.dedent(sys.stdin.read()))' << 'PYEOF'
          import os, re, sys

          # 1. Verify fs/stat.c is completely clean of SUSFS while preserving ksu_handle_stat
          stat_c = open("fs/stat.c").read()
          assert "susfs" not in stat_c.lower() and "STATX_SUS_KSTAT" not in stat_c, "SUSFS found in fs/stat.c"
          assert "ksu_handle_stat" in stat_c, "ksu_handle_stat missing in fs/stat.c"
          print("[PASS] fs/stat.c clean (zero SUSFS, ksu_handle_stat preserved)")

          # 2. Wire ksu_handle_sys_reboot in kernel/reboot.c
          reb = open("kernel/reboot.c").read()
          if "ksu_handle_sys_reboot" not in reb:
              anchor = "SYSCALL_DEFINE4(reboot,"
              cap_anchor = "\tif (!ns_capable(pid_ns->user_ns, CAP_SYS_BOOT))"
              assert anchor in reb and cap_anchor in reb, "kernel/reboot.c anchors missing"
              decl = "#ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif\n\n"
              hook = "#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n"
              reb = reb.replace(anchor, decl + anchor, 1).replace(cap_anchor, hook + cap_anchor, 1)
              open("kernel/reboot.c", "w").write(reb)
              print("[PASS] Wired ksu_handle_sys_reboot in kernel/reboot.c")

          # 3. Wire ksu_handle_setresuid in kernel/sys.c
          sysc = open("kernel/sys.c").read()
          if "ksu_handle_setresuid" not in sysc:
              fn_anchor = "long __sys_setresuid(uid_t ruid, uid_t euid, uid_t suid)"
              sec_anchor = "\tretval = security_task_fix_setuid(new, old, LSM_SETID_RES);"
              assert fn_anchor in sysc and sec_anchor in sysc, "kernel/sys.c anchors missing"
              decl = "#ifdef CONFIG_KSU\nextern int ksu_handle_setresuid(uid_t ruid, uid_t euid, uid_t suid);\n#endif\n\n"
              hook = "#ifdef CONFIG_KSU\n\tksu_handle_setresuid(ruid, euid, suid);\n#endif\n"
              sysc = sysc.replace(fn_anchor, decl + fn_anchor, 1).replace(sec_anchor, hook + sec_anchor, 1)
              open("kernel/sys.c", "w").write(sysc)
              print("[PASS] Wired ksu_handle_setresuid in kernel/sys.c")

          # 4. Check ksu_handle_devpts in KSUN v3.1.0-legacy
          su_blob = "\n".join(open(p, errors="ignore").read() for p in ["drivers/kernelsu/sucompat.c", "drivers/kernelsu/ksu.c", "drivers/kernelsu/ksud.c"] if os.path.exists(p))
          if "ksu_handle_devpts" not in su_blob and os.path.exists("fs/devpts/inode.c"):
              dp = open("fs/devpts/inode.c").read()
              if "ksu_handle_devpts" in dp:
                  dp = re.sub(r"#ifdef CONFIG_KSU\s*extern int ksu_handle_devpts\([^\)]*\);\s*#endif", "", dp, flags=re.S)
                  dp = re.sub(r"#ifdef CONFIG_KSU\s*ksu_handle_devpts\([^\)]*\);\s*#endif", "", dp, flags=re.S)
                  open("fs/devpts/inode.c", "w").write(dp)
                  print("[PASS] Removed obsolete ksu_handle_devpts from fs/devpts/inode.c")

          # 5. Relax init/Kconfig KALLSYMS_ALL dependency (required for KPM / KPatch-Next)
          ik = open("init/Kconfig").read()
          ik2 = re.sub(r'(config KALLSYMS_ALL\n\s+bool "Include all symbols in kallsyms"\n\s+)depends on DEBUG_KERNEL && KALLSYMS', r'\1depends on KALLSYMS', ik)
          if ik2 != ik:
              open("init/Kconfig", "w").write(ik2)
              print("[PASS] Relaxed init/Kconfig KALLSYMS_ALL dependency for KPM")

          # 6. Update vendor/pipa_defconfig: KSUN + KPM-ready, ZERO SUSFS
          defcfg_path = "arch/arm64/configs/vendor/pipa_defconfig"
          defcfg = "\n".join(l for l in open(defcfg_path).read().splitlines() if "SUSFS" not in l) + "\n"
          opts = ["CONFIG_KSU=y", "CONFIG_KALLSYMS=y", "CONFIG_KALLSYMS_ALL=y", "CONFIG_OVERLAY_FS=y", "# CONFIG_TRIM_UNUSED_KSYMS is not set"]
          kcfg = open("drivers/kernelsu/Kconfig", errors="ignore").read()
          if "config KSU_MANUAL_HOOK" in kcfg:
              opts.append("CONFIG_KSU_MANUAL_HOOK=y")
          if "config KSU_WITH_KPROBES" in kcfg:
              opts.append("# CONFIG_KSU_WITH_KPROBES is not set")
          for opt in opts:
              key = opt.split("=")[0].replace("# ", "").replace(" is not set", "")
              if re.search(rf"^(# )?{re.escape(key)}[= ]", defcfg, re.M):
                  defcfg = re.sub(rf"^(# )?{re.escape(key)}[= ].*$", opt, defcfg, flags=re.M)
              else:
                  defcfg += f"\n{opt}\n"
          open(defcfg_path, "w").write(defcfg)
          print("[PASS] Updated vendor/pipa_defconfig:", opts)
          PYEOF

      - name: Static validation gate (Zero SUSFS + KSUN 4.19 ABI match)
        if: ${{ github.event.inputs.repack_only != 'true' }}
        run: |
          set -euo pipefail
          cd kernel
          echo "=== Static Validation Gate (Zero SUSFS + KSUN ABI) ==="
          test ! -e fs/susfs.c && test ! -e include/linux/susfs.h && test ! -e include/linux/susfs_def.h
          echo "[PASS] Zero SUSFS source/header files"
          if grep -rnE 'susfs|SUSFS|STATX_SUS_KSTAT' fs/ kernel/ include/linux/ drivers/kernelsu/ arch/arm64/configs/vendor/pipa_defconfig 2>/dev/null; then
            echo "[FAIL] Residual SUSFS reference found!" >&2
            exit 1
          fi
          echo "[PASS] Zero SUSFS / STATX_SUS_KSTAT references in tree"
          grep -Eq '^\s*ksu_handle_setresuid\s*\(' kernel/sys.c && echo "[PASS] ksu_handle_setresuid in kernel/sys.c"
          grep -Eq '^\s*ksu_handle_sys_reboot\s*\(' kernel/reboot.c && echo "[PASS] ksu_handle_sys_reboot in kernel/reboot.c"
          grep -Eq 'ksu_handle_faccessat\s*\(\s*&' fs/open.c && echo "[PASS] ksu_handle_faccessat in fs/open.c"
          grep -Eq 'ksu_handle_stat\s*\(\s*&' fs/stat.c && echo "[PASS] ksu_handle_stat in fs/stat.c"
          echo "GATE RESULT: PASSED" | tee ../abi-gate.txt

      - name: Free disk space & install build dependencies
        if: ${{ github.event.inputs.repack_only != 'true' }}
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential ccache cpio curl flex git \
            kmod libelf-dev libssl-dev llvm lld python3 python3-pip unzip xz-utils zip zstd

      - name: Download AOSP Clang (clang-r522817, fallback clang-r547379)
        if: ${{ github.event.inputs.repack_only != 'true' }}
        run: |
          mkdir -p "$HOME/clang"
          CLANG_REV="clang-r522817"
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${CLANG_REV}.tar.gz"
          if ! curl -fsSL "$URL" -o "$HOME/clang.tar.gz"; then
            CLANG_REV="clang-r547379"
            URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${CLANG_REV}.tar.gz"
            curl -fsSL "$URL" -o "$HOME/clang.tar.gz"
          fi
          tar -xzf "$HOME/clang.tar.gz" -C "$HOME/clang"
          rm -f "$HOME/clang.tar.gz"
          echo "CLANG_REV=${CLANG_REV}" >> "$GITHUB_ENV"
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version | head -n 2

      - name: Build N0Kernel r2 (KSUN v3.1.0-legacy + KPM-ready ThinLTO OFF, Zero SUSFS)
        if: ${{ github.event.inputs.repack_only != 'true' }}
        run: |
          set -euo pipefail
          cd kernel
          MAKE_ARGS="O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make -j"$(nproc)" $MAKE_ARGS vendor/pipa_defconfig
          scripts/config --file out/.config --set-str LOCALVERSION "-r2-ksun-kpm"
          scripts/config --file out/.config \
            -e KSU \
            -e KALLSYMS \
            -e KALLSYMS_ALL \
            -d TRIM_UNUSED_KSYMS \
            -e LTO_NONE \
            -d LTO \
            -d LTO_CLANG \
            -d LTO_CLANG_THIN \
            -d LTO_CLANG_FULL \
            -d THINLTO \
            -d CFI_CLANG \
            -d CFI_PERMISSIVE \
            -d LD_DEAD_CODE_DATA_ELIMINATION
          make -j"$(nproc)" $MAKE_ARGS olddefconfig
          grep -E 'CONFIG_(LOCALVERSION|KSU|KALLSYMS|LTO|CFI|TRIM_UNUSED_KSYMS|SUSFS)' out/.config | sort | tee ../config-audit.txt
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KALLSYMS=y$' out/.config
          grep -q '^CONFIG_KALLSYMS_ALL=y$' out/.config
          ! grep -q '^CONFIG_LTO_CLANG_THIN=y$' out/.config
          ! grep -q '^CONFIG_LTO=y$' out/.config
          ! grep -q '^CONFIG_LTO_CLANG=y$' out/.config
          ! grep -qE '^CONFIG_.*SUSFS.*=y$' out/.config
          make -j"$(nproc)" $MAKE_ARGS Image.gz 2>&1 | tee ../build.log
          test -s out/arch/arm64/boot/Image.gz
          ls -lh out/arch/arm64/boot/Image.gz

      - name: Post-build error & KSU warning audit
        if: ${{ github.event.inputs.repack_only != 'true' }}
        run: |
          set -euo pipefail
          if grep -E '(^| )error:' build.log; then
            echo "[FAIL] Compiler errors found!" >&2
            exit 1
          fi
          echo "[PASS] Zero compiler errors in build.log" | tee -a abi-gate.txt
          if grep -E '(drivers/kernelsu|KernelSU-Next).*warning:' build.log; then
            echo "[WARN] Warnings in KernelSU-Next files (review above)"
          else
            echo "[PASS] Zero warnings in KernelSU-Next files" | tee -a abi-gate.txt
          fi

      - name: Package Image.gz-only AnyKernel3 zip & SHA-256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event.inputs.repack_only }}" == "true" ]]; then
            mkdir -p kernel/out/arch/arm64/boot
            gh release download r2-ksun-kpm-v1 -p '*.zip' -D /tmp/old_ak3 --clobber
            unzip -j /tmp/old_ak3/*.zip Image.gz -d kernel/out/arch/arm64/boot/
            ls -lh kernel/out/arch/arm64/boot/Image.gz
          fi
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3_work
          rm -rf ak3_work/.git ak3_work/modules ak3_work/patch ak3_work/ramdisk ak3_work/README.md
          printf '%s\n' \
            "### AnyKernel3 Ramdisk Mod Script" \
            "properties() { '" \
            "kernel.string=N0Kernel r2 (KSUN v3.1.0-legacy + KPM-ready, No SUSFS) for pipa" \
            "do.devicecheck=1" \
            "do.modules=0" \
            "do.systemless=1" \
            "do.cleanup=1" \
            "do.cleanuponabort=0" \
            "device.name1=pipa" \
            "supported.versions=13-16" \
            "supported.patchlevels=" \
            "'; }" \
            "" \
            "BLOCK=boot;" \
            "block=boot;" \
            "IS_SLOT_DEVICE=1;" \
            "is_slot_device=1;" \
            "RAMDISK_COMPRESSION=auto;" \
            "ramdisk_compression=auto;" \
            "PATCH_VBMETA_FLAG=auto;" \
            "patch_vbmeta_flag=auto;" \
            "" \
            ". tools/ak3-core.sh;" \
            "" \
            "split_boot;" \
            "flash_boot;" > ak3_work/anykernel.sh
          cat ak3_work/anykernel.sh
          cp kernel/out/arch/arm64/boot/Image.gz ak3_work/Image.gz
          ZIP_NAME="N0Kernel-r2-KSUN-v3.1.0-KPM-noSUSFS-pipa-AnyKernel3.zip"
          (cd ak3_work && zip -r9 "../${ZIP_NAME}" * -x '*.git*')
          unzip -l "${ZIP_NAME}"
          if unzip -l "${ZIP_NAME}" | awk '{print $4}' | grep -Eq '^(Image|dtb|dtbo\.img)$'; then
            echo "ERROR: Forbidden raw Image/dtb/dtbo.img in ${ZIP_NAME}" >&2
            exit 1
          fi
          sha256sum "${ZIP_NAME}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: n0kernel-r2-ksun-kpm-nosusfs-pipa
          if-no-files-found: ignore
          path: |
            N0Kernel-r2-KSUN-v3.1.0-KPM-noSUSFS-pipa-AnyKernel3.zip
            SHA256SUMS.txt
            abi-gate.txt
            config-audit.txt

      - name: Publish GitHub Release (r2-ksun-kpm-v1)
        if: ${{ github.event.inputs.publish_release != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="r2-ksun-kpm-v1"
          ZIP_NAME="N0Kernel-r2-KSUN-v3.1.0-KPM-noSUSFS-pipa-AnyKernel3.zip"
          R1_C="${R1_COMMIT:-e6708914262c72b3e7eea0433ee5c33b9029e32f}"
          K_TAG="${KSUN_TAG:-v3.1.0-legacy}"
          K_C="${KSUN_COMMIT:-1ce19e536de730829b62d0d23dbd96c6ec809e2f}"
          CL_R="${CLANG_REV:-clang-r522817}"
          SHA_LINE="$(cat SHA256SUMS.txt)"
          printf '%s\n' \
            "## N0Kernel r2 — KernelSU-Next ${K_TAG} + KPM-ready (Zero SUSFS) for Xiaomi Pad 6 (pipa)" \
            "" \
            "- **Base:** CuriousNom/n0_kernel_pipa \`r1\` (\`${R1_C}\`)" \
            "- **KernelSU-Next:** \`${K_TAG}\` (\`${K_C}\`)" \
            "- **SUSFS:** Completely removed (zero SUSFS files, headers, patches, or config flags)" \
            "- **KPM Readiness:** \`CONFIG_KALLSYMS=y\`, \`CONFIG_KALLSYMS_ALL=y\`, \`CONFIG_TRIM_UNUSED_KSYMS=n\`, \`CONFIG_LTO_NONE=y\` (\`LOCALVERSION=-r2-ksun-kpm\`)" \
            "- **Toolchain:** Google AOSP Clang \`${CL_R}\`" \
            "- **Packaging:** \`Image.gz\`-only AnyKernel3 (\`BLOCK=boot\`, \`IS_SLOT_DEVICE=1\`, \`split_boot; flash_boot;\`)" \
            "" \
            "### SHA-256 Checksum" \
            '```' \
            "${SHA_LINE}" \
            '```' > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ZIP_NAME}" SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "${ZIP_NAME}" SHA256SUMS.txt \
              --title "N0Kernel r2 — KSUN v3.1.0-legacy + KPM-ready (No SUSFS, pipa)" \
              --notes-file release-notes.md
          fi
          
