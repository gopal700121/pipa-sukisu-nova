name: Build N0Kernel r2 (KSUN v3.1.0 + SUSFS v2.1.0) for Xiaomi Pad 6 (pipa)

on:
  workflow_dispatch:
    inputs:
      ksun_ref:
        description: "KernelSU-Next ref (default: legacy_susfs — v3.1.0-legacy-susfs line)"
        required: false
        default: "legacy_susfs"
      publish_release:
        description: "Publish GitHub Release r2-ksun-v1"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  build-n0-r2:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Clone N0Kernel r1 base & strip old KernelSU
        run: |
          git clone --depth=1 --branch r1 https://github.com/CuriousNom/n0_kernel_pipa.git kernel
          cd kernel
          R1_COMMIT="$(git rev-parse HEAD)"
          echo "R1_COMMIT=${R1_COMMIT}" >> "$GITHUB_ENV"
          echo "Base N0Kernel r1 commit: ${R1_COMMIT}"
          rm -rf KernelSU KernelSU-Next drivers/kernelsu
          git status -s

      - name: Integrate single-source KSUN v3.1.0-legacy + SUSFS v2.1.0 (wagamy tag)
        run: |
          set -euo pipefail
          WORK_DIR="$(pwd)"
          cd kernel

          # Clone wagamy reference repo (lineage-23.2 clean base + ksun_v3.1.0-susfs_v2.1.0 tag)
          git clone --depth=1 --branch ksun_v3.1.0-susfs_v2.1.0 https://github.com/wagamy/android_kernel_oneplus_sm8250.git "$WORK_DIR/wagamy"
          git -C "$WORK_DIR/wagamy" fetch --depth=1 origin lineage-23.2:refs/remotes/origin/lineage-23.2
          WAGAMY_COMMIT="$(git -C "$WORK_DIR/wagamy" rev-parse HEAD)"
          echo "SUSFS_COMMIT=${WAGAMY_COMMIT}" >> "$GITHUB_ENV"
          echo "KSUN_COMMIT=${WAGAMY_COMMIT}" >> "$GITHUB_ENV"
          echo "CHOSEN_KSUN_TAG=v3.1.0-legacy-susfs@wagamy-${WAGAMY_COMMIT:0:8}" >> "$GITHUB_ENV"
          echo "wagamy ksun_v3.1.0-susfs_v2.1.0 commit: ${WAGAMY_COMMIT}"

          # 1) Wholesale copy of device-independent KernelSU-Next/kernel/ + SUSFS v2.1.0 core files ONLY
          rm -rf KernelSU-Next drivers/kernelsu
          mkdir -p KernelSU-Next
          cp -r "$WORK_DIR/wagamy/KernelSU-Next/kernel" KernelSU-Next/kernel
          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          if ! grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi
          if ! grep -q 'kernelsu' drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi

          cp "$WORK_DIR/wagamy/fs/susfs.c" fs/susfs.c
          cp "$WORK_DIR/wagamy/include/linux/susfs.h" include/linux/susfs.h
          cp "$WORK_DIR/wagamy/include/linux/susfs_def.h" include/linux/susfs_def.h
          grep -E 'SUSFS_VERSION|SUSFS_MAGIC|TIF_PROC_UMOUNTED' include/linux/susfs*.h || true

          # 2) Extract pure generic SUSFS/KSU hook diff from wagamy (NEVER arch/, DTS, or OnePlus drivers)
          HOOK_FILES=(
            fs/Makefile fs/namespace.c fs/readdir.c fs/statfs.c fs/namei.c fs/super.c
            fs/internal.h fs/mount.h fs/notify/fdinfo.c fs/proc/base.c fs/proc/cmdline.c
            fs/proc/fd.c fs/proc/task_mmu.c fs/proc_namespace.c
            kernel/kallsyms.c security/selinux/avc.c
            include/linux/seccomp.h include/linux/sched.h include/linux/mount.h
          )
          git -C "$WORK_DIR/wagamy" diff origin/lineage-23.2..HEAD -- "${HOOK_FILES[@]}" > "$WORK_DIR/wagamy-susfs-v2.1.0-hooks.patch"
          echo "=== Files in wagamy-susfs-v2.1.0-hooks.patch ==="
          grep '^diff --git' "$WORK_DIR/wagamy-susfs-v2.1.0-hooks.patch" || true

          set +e
          patch -p1 --fuzz=3 --forward < "$WORK_DIR/wagamy-susfs-v2.1.0-hooks.patch"
          PATCH_RC=$?
          set -e
          echo "wagamy-susfs-v2.1.0-hooks.patch exit code: ${PATCH_RC}"
          find . -maxdepth 5 -name '*.rej' -print

      - name: Reconcile known 4.19 SUSFS rejects & wire/verify KSUN manual hooks
        run: |
          set -euo pipefail
          cd kernel
          python3 ../scripts/reconcile_ksun_susfs.py
      

      - name: Run blocking pre-build ABI & Hook Gate (ksu_abi_gate.sh + gate-run12.sh)
        run: |
          chmod +x scripts/ksu_abi_gate.sh scripts/gate-run12.sh
          ./scripts/ksu_abi_gate.sh kernel | tee abi-gate.txt
          (cd kernel && bash ../scripts/gate-run12.sh) | tee -a abi-gate.txt
      - name: Free disk space & install build dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential ccache cpio curl flex git \
            kmod libelf-dev libssl-dev llvm lld python3 python3-pip unzip xz-utils zip zstd

      - name: Download AOSP Clang (clang-r522817, fallback clang-r547379)
        run: |
          mkdir -p "$HOME/clang"
          CLANG_REV="clang-r522817"
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${CLANG_REV}.tar.gz"
          if ! curl -fsSL "$URL" -o "$HOME/clang.tar.gz"; then
            CLANG_REV="clang-r547379"
            URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${CLANG_REV}.tar.gz"
            curl -fsSL "$URL" -o "$HOME/clang.tar.gz"
          fi
          tar -xzf "$HOME/clang.tar.gz" -C "$HOME/clang"
          rm -f "$HOME/clang.tar.gz"
          echo "CLANG_REV=${CLANG_REV}" >> "$GITHUB_ENV"
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version | head -n 2

      - name: Build A (r2-A — ThinLTO ON, daily driver)
        run: |
          set -euo pipefail
          cd kernel
          MAKE_ARGS="O=out_a ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make -j"$(nproc)" $MAKE_ARGS vendor/pipa_defconfig
          scripts/config --file out_a/.config --set-str LOCALVERSION "-r2-ksun"
          make -j"$(nproc)" $MAKE_ARGS olddefconfig
          make -j"$(nproc)" $MAKE_ARGS Image.gz 2>&1 | tee ../build-a.log
          test -s out_a/arch/arm64/boot/Image.gz
          ls -lh out_a/arch/arm64/boot/Image.gz
          grep -E 'CONFIG_(LOCALVERSION|KSU|LTO|CFI|KALLSYMS)' out_a/.config | sort > ../config-audit-A.txt

      - name: Post-build Gate A
        run: |
          ./scripts/ksu_abi_gate.sh kernel build-a.log | tee -a abi-gate.txt

      - name: Build B (r2-B — ThinLTO OFF for future KPM testing)
        run: |
          set -euo pipefail
          cd kernel
          MAKE_ARGS="O=out_b ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make -j"$(nproc)" $MAKE_ARGS vendor/pipa_defconfig
          scripts/config --file out_b/.config --set-str LOCALVERSION "-r2-ksun-nolto"
          scripts/config --file out_b/.config \
            -d LTO \
            -d LTO_CLANG \
            -d LTO_CLANG_THIN \
            -d LTO_CLANG_FULL \
            -d THINLTO \
            -d CFI_CLANG \
            -d CFI_PERMISSIVE \
            -d LD_DEAD_CODE_DATA_ELIMINATION
          make -j"$(nproc)" $MAKE_ARGS olddefconfig
          diff -u out_a/.config out_b/.config > ../config-diff-A-vs-B.txt || true
          cat ../config-diff-A-vs-B.txt
          make -j"$(nproc)" $MAKE_ARGS Image.gz 2>&1 | tee ../build-b.log
          test -s out_b/arch/arm64/boot/Image.gz
          ls -lh out_b/arch/arm64/boot/Image.gz
          grep -E 'CONFIG_(LOCALVERSION|KSU|LTO|CFI|KALLSYMS)' out_b/.config | sort > ../config-audit-B.txt

      - name: Post-build Gate B
        run: |
          ./scripts/ksu_abi_gate.sh kernel build-b.log | tee -a abi-gate.txt

      - name: Package Image.gz-only AnyKernel3 zips & SHA-256 checksums
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3_tmpl

          package_ak3() {
            local LABEL="$1"
            local IMG_PATH="$2"
            local ZIP_NAME="$3"
            rm -rf ak3_work
            cp -r AnyKernel3_tmpl ak3_work
            rm -rf ak3_work/.git ak3_work/modules ak3_work/patch ak3_work/ramdisk ak3_work/README.md
            cat > ak3_work/anykernel.sh << 'AKEOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=N0Kernel r2 (KSUN v3.1.0 + SUSFS v2.1.0) for Xiaomi Pad 6 (pipa)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=pipa
          supported.versions=13-16
          supported.patchlevels=
          '; }

          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          AKEOF
            sed -i 's/^[[:space:]]*//' ak3_work/anykernel.sh
            cp "${IMG_PATH}" ak3_work/Image.gz
            (cd ak3_work && zip -r9 "../${ZIP_NAME}" * -x '*.git*')
            echo "=== Contents of ${ZIP_NAME} ==="
            unzip -l "${ZIP_NAME}"
            if unzip -l "${ZIP_NAME}" | awk '{print $4}' | grep -Eq '^(Image|dtb|dtbo\.img)$'; then
              echo "ERROR: Forbidden raw Image/dtb/dtbo.img detected in ${ZIP_NAME}" >&2
              exit 1
            fi
          }

          ZIP_A="N0Kernel-r2-A-KSUN-v3.1.0-SUSFS-v2.1.0-pipa-AnyKernel3.zip"
          ZIP_B="N0Kernel-r2-B-KSUN-v3.1.0-SUSFS-v2.1.0-nolto-pipa-AnyKernel3.zip"
          package_ak3 "r2-A" "kernel/out_a/arch/arm64/boot/Image.gz" "${ZIP_A}"
          package_ak3 "r2-B" "kernel/out_b/arch/arm64/boot/Image.gz" "${ZIP_B}"

          sha256sum "${ZIP_A}" "${ZIP_B}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

          cat > build-metadata.txt << EOF
          R1_COMMIT=${R1_COMMIT}
          CHOSEN_KSUN_TAG=${CHOSEN_KSUN_TAG}
          KSUN_COMMIT=${KSUN_COMMIT}
          SUSFS_COMMIT=${SUSFS_COMMIT}
          CLANG_REV=${CLANG_REV}
          ZIP_A=${ZIP_A}
          ZIP_B=${ZIP_B}
          EOF
          sed -i 's/^[[:space:]]*//' build-metadata.txt
          cat build-metadata.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: n0kernel-r2-ksun-susfs-pipa
          path: |
            N0Kernel-r2-A-KSUN-v3.1.0-SUSFS-v2.1.0-pipa-AnyKernel3.zip
            N0Kernel-r2-B-KSUN-v3.1.0-SUSFS-v2.1.0-nolto-pipa-AnyKernel3.zip
            SHA256SUMS.txt
            abi-gate.txt
            config-audit-A.txt
            config-audit-B.txt
            config-diff-A-vs-B.txt
            build-metadata.txt

      - name: Publish GitHub Release (r2-ksun-v1)
        if: ${{ github.event.inputs.publish_release != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="r2-ksun-v1"
          NOTES_FILE="release-notes.md"
          cat > "$NOTES_FILE" << EOF
          ## N0Kernel r2 — KernelSU-Next ${CHOSEN_KSUN_TAG} + SUSFS v2.1.0 (Xiaomi Pad 6 / pipa)

          - **Base:** CuriousNom/n0_kernel_pipa \`r1\` (\`${R1_COMMIT}\`)
          - **KernelSU-Next:** \`${CHOSEN_KSUN_TAG}\` (\`${KSUN_COMMIT}\`)
          - **SUSFS4KSU (\`kernel-4.19\`):** \`${SUSFS_COMMIT}\`
          - **Toolchain:** Google AOSP Clang \`${CLANG_REV}\`
          - **Packaging:** \`Image.gz\`-only AnyKernel3 (\`is_slot_device=1\`, \`split_boot; flash_boot;\`)

          ### SHA-256 Checksums
          \`\`\`
          $(cat SHA256SUMS.txt)
          \`\`\`
          EOF
          sed -i 's/^[[:space:]]*//' "$NOTES_FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              N0Kernel-r2-A-KSUN-v3.1.0-SUSFS-v2.1.0-pipa-AnyKernel3.zip \
              N0Kernel-r2-B-KSUN-v3.1.0-SUSFS-v2.1.0-nolto-pipa-AnyKernel3.zip \
              SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              N0Kernel-r2-A-KSUN-v3.1.0-SUSFS-v2.1.0-pipa-AnyKernel3.zip \
              N0Kernel-r2-B-KSUN-v3.1.0-SUSFS-v2.1.0-nolto-pipa-AnyKernel3.zip \
              SHA256SUMS.txt \
              --title "N0Kernel r2 — KSUN v3.1.0 + SUSFS v2.1.0 (pipa)" \
              --notes-file "$NOTES_FILE"
          fi
