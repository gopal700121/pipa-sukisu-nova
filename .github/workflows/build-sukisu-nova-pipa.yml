name: Build SukiSU-Ultra + KPM + SUSFS AnyKernel3 (pipa r1)

on:
  workflow_dispatch:
    inputs:
      kernel_zip_url:
        description: 'Direct kernel source zip URL'
        required: true
        default: 'https://github.com/CuriousNom/n0_kernel_pipa/archive/refs/tags/r1.zip'
      clang_rev:
        description: 'Google AOSP Clang revision (native MLGO support)'
        type: choice
        default: 'clang-r522817'
        options:
          - clang-r522817
          - clang-r547379
      defconfig:
        description: 'Defconfig path (leave empty to auto-detect pipa defconfig)'
        required: false
        default: ''
      enable_susfs:
        description: 'Ensure SUSFS 4.19 is present and enabled'
        type: boolean
        default: true
      fail_on_patch_reject:
        description: 'Stop if SUSFS patch has unresolved .rej conflicts'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
            libelf-dev cpio zip unzip curl wget git python-is-python3 patch file \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download & verify Google AOSP Clang (MLGO)
        shell: bash
        run: |
          set -euo pipefail
          DOWNLOADED=0
          for REV in "${{ inputs.clang_rev }}" "clang-r547379" "clang-r522817"; do
            URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${REV}.tar.gz"
            echo "[+] Trying AOSP Clang: $REV"
            if curl -fL --retry 3 "$URL" -o clang.tar.gz; then
              rm -rf "$HOME/clang" && mkdir -p "$HOME/clang"
              tar -xzf clang.tar.gz -C "$HOME/clang"
              rm -f clang.tar.gz
              if "$HOME/clang/bin/clang" -mllvm -regalloc-enable-advisor=release -x c -c /dev/null -o /dev/null; then
                echo "[+] Verified $REV with native MLGO support:"
                "$HOME/clang/bin/clang" --version
                DOWNLOADED=1
                break
              fi
            fi
          done
          if [ "$DOWNLOADED" -ne 1 ]; then
            echo "::error::Failed to download a working AOSP Clang with MLGO support."
            exit 1
          fi

      - name: Download and extract kernel source (r1.zip)
        shell: bash
        run: |
          curl -fL --retry 3 "${{ inputs.kernel_zip_url }}" -o kernel_src.zip
          mkdir -p tmp_src kernel
          unzip -q kernel_src.zip -d tmp_src
          shopt -s dotglob
          mv tmp_src/*/* kernel/
          rm -rf tmp_src kernel_src.zip
          ls -la kernel/Makefile

      - name: Detect existing SUSFS and KSU hooks in kernel source
        working-directory: kernel
        run: |
          if [ -f "fs/susfs.c" ] && [ -f "include/linux/susfs.h" ]; then
            echo "[+] SUSFS is ALREADY included in kernel source — skipping SUSFS kernel patch."
            grep -E "SUSFS_VERSION" include/linux/susfs.h || true
            echo "SUSFS_ALREADY_PRESENT=true" >> "$GITHUB_ENV"
          else
            echo "[+] SUSFS is NOT included in kernel source — will apply SUSFS 4.19 backport."
            echo "SUSFS_ALREADY_PRESENT=false" >> "$GITHUB_ENV"
          fi

          if grep -q "ksu_handle_execveat" fs/exec.c 2>/dev/null; then
            echo "[+] Manual KSU hooks are ALREADY present in kernel source."
            echo "KSU_HOOKS_PRESENT=true" >> "$GITHUB_ENV"
          else
            echo "[+] Manual KSU hooks not detected — will apply inline hooks."
            echo "KSU_HOOKS_PRESENT=false" >> "$GITHUB_ENV"
          fi

      - name: Integrate SukiSU-Ultra (builtin branch from GitHub)
        working-directory: kernel
        run: |
          set -euo pipefail
          rm -rf KernelSU drivers/kernelsu

          curl -fLSs --retry 3 \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            -o ksu_setup.sh

          if head -n 5 ksu_setup.sh | grep -qiE "<!DOCTYPE|<html"; then
            echo "::error::Downloaded ksu_setup.sh is HTML, not a shell script!"
            head -n 20 ksu_setup.sh
            exit 1
          fi

          BRANCHES=$(git ls-remote --heads https://github.com/SukiSU-Ultra/SukiSU-Ultra.git | awk '{print $2}' | sed 's|refs/heads/||')
          echo "[+] Available branches:"
          echo "$BRANCHES"

          TARGET_BRANCH=""
          for b in builtin nongki susfs-main main; do
            if echo "$BRANCHES" | grep -qx "$b"; then
              TARGET_BRANCH="$b"
              break
            fi
          done

          echo "[+] Installing SukiSU-Ultra branch: ${TARGET_BRANCH:-default}"
          if [ -n "$TARGET_BRANCH" ]; then
            bash ksu_setup.sh "$TARGET_BRANCH"
          else
            bash ksu_setup.sh
          fi
          rm -f ksu_setup.sh

          echo "[+] Checking drivers/kernelsu/Kconfig:"
          grep -E "^config (KSU|KPM)" drivers/kernelsu/Kconfig || true

      - name: Apply SUSFS 4.19 patches and inline hooks (only if missing)
        if: ${{ inputs.enable_susfs }}
        working-directory: kernel
        run: |
          PATCH_BASE="https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches"

          if [ "${{ env.SUSFS_ALREADY_PRESENT }}" = "true" ]; then
            echo "[+] Skipping susfs_patch_to_4.19.patch (already in source)."
          else
            echo "[+] Downloading susfs_patch_to_4.19.patch..."
            curl -fLSs --retry 3 "${PATCH_BASE}/Patch/susfs_patch_to_4.19.patch" -o susfs_patch_to_4.19.patch

            echo "[+] Applying SUSFS 4.19 kernel patch..."
            set +e
            patch -p1 --fuzz=3 --forward < susfs_patch_to_4.19.patch
            PATCH_RC=$?
            set -e
            rm -f susfs_patch_to_4.19.patch

            if [ -f "fs/proc/task_mmu.c.rej" ]; then
              echo "[+] Applying targeted fixup for fs/proc/task_mmu.c Hunk #7..."
              python3 -c 'import textwrap, sys; exec(textwrap.dedent(sys.stdin.read()))' << 'PYEOF'
          from pathlib import Path

          path = Path("fs/proc/task_mmu.c")
          content = path.read_text()

          target = (
              "\t\tret = down_read_killable(&mm->mmap_sem);\n"
              "\t\tif (ret)\n"
              "\t\t\tgoto out_free;\n"
              "\t\tret = walk_page_range(mm, start_vaddr, end, &pagemap_ops, &pm);\n"
              "\t\tup_read(&mm->mmap_sem);\n"
          )

          replacement = (
              "\t\tret = down_read_killable(&mm->mmap_sem);\n"
              "\t\tif (ret)\n"
              "\t\t\tgoto out_free;\n"
              "#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
              "\t\tvma = find_vma(mm, start_vaddr);\n"
              "\t\tif (vma && vma->vm_file && SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))\n"
              "\t\t\tgoto bypass_orig_flow;\n"
              "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
              "\t\tret = walk_page_range(mm, start_vaddr, end, &pagemap_ops, &pm);\n"
              "#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
              "bypass_orig_flow:\n"
              "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
              "\t\tup_read(&mm->mmap_sem);\n"
          )

          assert content.count(target) == 1, f"Expected target anchor once, found {content.count(target)}"
          updated = content.replace(target, replacement, 1)
          path.write_text(updated)
          Path("fs/proc/task_mmu.c.rej").unlink()

          lines = updated.splitlines()
          idx = next(i for i, l in enumerate(lines) if "bypass_orig_flow:" in l)
          for i in range(max(0, idx - 15), min(len(lines), idx + 10)):
              print(f"{i + 1}: {lines[i]}")
          PYEOF
              if [ -z "$(find . -name '*.rej')" ]; then
                PATCH_RC=0
              fi
            fi

            REJ_FILES=$(find . -name "*.rej")
            if [ -n "$REJ_FILES" ]; then
              echo "::warning::Patch produced reject (.rej) files:"
              echo "$REJ_FILES"
              mkdir -p ../patch-rejects
              for f in $REJ_FILES; do
                cp --parents "$f" ../patch-rejects/
                orig="${f%.rej}"
                [ -f "$orig" ] && cp --parents "$orig" ../patch-rejects/
              done
              echo "HAS_REJECTS=true" >> "$GITHUB_ENV"
              if [ "${{ inputs.fail_on_patch_reject }}" = "true" ]; then
                echo "::error::Stopping due to patch rejects. Download 'susfs-patch-rejects' artifact to resolve them."
                exit 1
              fi
            elif [ "$PATCH_RC" -ne 0 ]; then
              echo "::error::patch exited with code $PATCH_RC without .rej files."
              exit "$PATCH_RC"
            fi
          fi

          if [ "${{ env.KSU_HOOKS_PRESENT }}" = "true" ]; then
            echo "[+] Skipping susfs_inline_hook_patches.sh (hooks already in source)."
          else
            echo "[+] Applying SUSFS inline hook script..."
            curl -fLSs --retry 3 "${PATCH_BASE}/susfs_inline_hook_patches.sh" -o susfs_inline_hook_patches.sh
            bash susfs_inline_hook_patches.sh
            rm -f susfs_inline_hook_patches.sh
          fi

          echo "[+] Verifying SUSFS source files:"
          ls -la fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h

      - name: Upload patch rejects (on conflict)
        if: failure() && env.HAS_REJECTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: susfs-patch-rejects
          path: patch-rejects/

      - name: Apply Linux 4.19 compat fixes (static_call, SUSFS 2.4, KPM access_ok, sulog, devpts)
        working-directory: kernel
        run: |
          python3 -c 'import textwrap, sys; exec(textwrap.dedent(sys.stdin.read()))' << 'PYEOF'
          import pathlib, re

          # Fix 1: Guard #include <linux/static_call.h> for kernels < 5.10
          inc_path = pathlib.Path("drivers/kernelsu/kernel_includes.h")
          if inc_path.exists():
              text = inc_path.read_text()
              needle = "#include <linux/static_call.h>"
              if needle in text and "KERNEL_VERSION(5, 10, 0)" not in text.split(needle)[0][-120:]:
                  replacement = (
                      "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 10, 0)\n"
                      "#include <linux/static_call.h>\n"
                      "#endif"
                  )
                  text = text.replace(needle, replacement, 1)
                  inc_path.write_text(text)
                  print("[+] Fix 1: Guarded <linux/static_call.h> in kernel_includes.h")

          # Fix 2: Ensure CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER exists in Kconfig
          susfs_h = pathlib.Path("include/linux/susfs.h").read_text() if pathlib.Path("include/linux/susfs.h").exists() else ""
          susfs_def_h = pathlib.Path("include/linux/susfs_def.h").read_text() if pathlib.Path("include/linux/susfs_def.h").exists() else ""
          susfs_c = pathlib.Path("fs/susfs.c").read_text() if pathlib.Path("fs/susfs.c").exists() else ""
          kconfig_path = pathlib.Path("drivers/kernelsu/Kconfig")
          if kconfig_path.exists():
              kc = kconfig_path.read_text()
              if ("KSU_SUSFS_PRIORITY_UID_FILTER" in (susfs_h + susfs_def_h + susfs_c)
                      and "config KSU_SUSFS_PRIORITY_UID_FILTER" not in kc):
                  stanza = (
                      "\nconfig KSU_SUSFS_PRIORITY_UID_FILTER\n"
                      "\tbool \"Enable SUSFS priority UID filter\"\n"
                      "\tdepends on KSU_SUSFS\n"
                      "\tdefault y\n"
                  )
                  kc = kc.replace("\nendmenu", stanza + "\nendmenu", 1) if "\nendmenu" in kc else (kc + stanza)
                  kconfig_path.write_text(kc)
                  print("[+] Fix 2: Added config KSU_SUSFS_PRIORITY_UID_FILTER to drivers/kernelsu/Kconfig")

          # Fix 3: Ensure fs/stat.c includes the header declaring susfs_is_current_app_uid
          stat_path = pathlib.Path("fs/stat.c")
          if stat_path.exists():
              stat_txt = stat_path.read_text()
              if "susfs_is_current_app_uid" in stat_txt:
                  decl_in_susfs = "susfs_is_current_app_uid" in susfs_h
                  decl_in_def = "susfs_is_current_app_uid" in susfs_def_h
                  if decl_in_susfs and "#include <linux/susfs.h>" not in stat_txt:
                      if "#include <linux/susfs_def.h>" in stat_txt:
                          stat_txt = stat_txt.replace(
                              "#include <linux/susfs_def.h>",
                              "#include <linux/susfs_def.h>\n#include <linux/susfs.h>",
                              1
                          )
                      else:
                          stat_txt = "#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs.h>\n#endif\n" + stat_txt
                      stat_path.write_text(stat_txt)
                      print("[+] Fix 3: Added #include <linux/susfs.h> to fs/stat.c")
                  elif decl_in_def and "#include <linux/susfs_def.h>" not in stat_txt:
                      stat_txt = "#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif\n" + stat_txt
                      stat_path.write_text(stat_txt)
                      print("[+] Fix 3: Added #include <linux/susfs_def.h> to fs/stat.c")

          # Fix 4: Linux < 5.0 3-argument access_ok(VERIFY_WRITE, addr, size) in kpm.c
          kpm_path = pathlib.Path("drivers/kernelsu/extension/kpm/kpm.c")
          if kpm_path.exists():
              kpm_txt = kpm_path.read_text()
              old_call = "access_ok(u64_to_user_ptr(cmd.result_code), sizeof(result))"
              if old_call in kpm_txt:
                  kpm_txt = kpm_txt.replace(
                      old_call,
                      "access_ok(VERIFY_WRITE, u64_to_user_ptr(cmd.result_code), sizeof(result))"
                  )
                  kpm_path.write_text(kpm_txt)
                  print("[+] Fix 4: Patched 3-arg access_ok() in drivers/kernelsu/extension/kpm/kpm.c")

          # Fix 5: Linux < 5.8 __strncpy_from_user_nofault helper in sulog/event.c
          event_path = pathlib.Path("drivers/kernelsu/sulog/event.c")
          if event_path.exists():
              ev_txt = event_path.read_text()
              new_ev_txt, count = re.subn(
                  r'(?<![A-Za-z0-9_])strncpy_from_user_nofault\s*\(',
                  '__strncpy_from_user_nofault(',
                  ev_txt
              )
              if count > 0:
                  event_path.write_text(new_ev_txt)
                  print(f"[+] Fix 5: Replaced {count} strncpy_from_user_nofault() call(s) in sulog/event.c")

          # Fix 6: Neutralize legacy ksu_handle_devpts call in fs/devpts/inode.c (not exported in SukiSU-Ultra v3.0.0)
          devpts_path = pathlib.Path("fs/devpts/inode.c")
          if devpts_path.exists():
              dp_txt = devpts_path.read_text()
              if "ksu_handle_devpts" in dp_txt:
                  dp_lines = [
                      ("// " + l if "extern" in l else re.sub(r"ksu_handle_devpts\s*\(", "(void)(", l))
                      if "ksu_handle_devpts" in l else l
                      for l in dp_txt.splitlines(keepends=True)
                  ]
                  devpts_path.write_text("".join(dp_lines))
                  print("[+] Fix 6: Neutralized legacy ksu_handle_devpts in fs/devpts/inode.c")
          PYEOF

      - name: Locate pipa defconfig and inject SukiSU-Ultra + SUSFS + KPM flags
        working-directory: kernel
        run: |
          DEFCONFIG="${{ inputs.defconfig }}"
          if [ -z "$DEFCONFIG" ]; then
            if [ -f "arch/arm64/configs/vendor/pipa_defconfig" ]; then
              DEFCONFIG="vendor/pipa_defconfig"
            elif [ -f "arch/arm64/configs/pipa_defconfig" ]; then
              DEFCONFIG="pipa_defconfig"
            else
              echo "Could not auto-detect pipa defconfig. Available matches:"
              find arch/arm64/configs -iname "*pipa*"
              exit 1
            fi
          fi
          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_ENV"

          CFG_FILE="arch/arm64/configs/$DEFCONFIG"
          cat << 'EOF' >> "$CFG_FILE"

          # SukiSU-Ultra / Nova (4.19 non-GKI builtin + KPM)
          CONFIG_KSU=y
          CONFIG_KPM=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y
          CONFIG_OVERLAY_FS=y
          EOF

          if grep -q "config KSU_MANUAL_HOOK" drivers/kernelsu/Kconfig 2>/dev/null; then
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$CFG_FILE"
          fi
          if grep -q "config KSU_KPROBES_HOOK" drivers/kernelsu/Kconfig 2>/dev/null; then
            echo "# CONFIG_KSU_KPROBES_HOOK is not set" >> "$CFG_FILE"
          fi

          if [ "${{ inputs.enable_susfs }}" = "true" ]; then
            cat << 'EOF' >> "$CFG_FILE"

          # SUSFS v2.4.0 options
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER=y
          EOF
          fi

      - name: Compile kernel (Image only)
        working-directory: kernel
        run: |
          set -o pipefail
          export PATH="$HOME/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          MAKE_ARGS=(
            O=out
            ARCH=arm64
            CC=clang
            HOSTCC=clang
            HOSTCXX=clang++
            LD=ld.lld
            HOSTLD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            READELF=llvm-readelf
            STRIP=llvm-strip
            LLVM=1
            LLVM_IAS=1
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          )
          make "${MAKE_ARGS[@]}" "$DEFCONFIG"

          echo "[+] Auditing active KSU, SUSFS, KPM & LTO flags in out/.config:"
          grep -E "^CONFIG_(KSU|KPM|KALLSYMS|LTO)" out/.config | tee ../config-audit.txt

          grep -q "^CONFIG_KSU=y$" out/.config
          grep -q "^CONFIG_KPM=y$" out/.config
          grep -q "^CONFIG_KALLSYMS_ALL=y$" out/.config
          if [ "${{ inputs.enable_susfs }}" = "true" ]; then
            grep -q "^CONFIG_KSU_SUSFS=y$" out/.config
          fi

          make -j"$(nproc)" "${MAKE_ARGS[@]}" Image 2>&1 | tee ../build.log
          file out/arch/arm64/boot/Image

      - name: Extract compiler errors (on failure)
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -nE "error:|fatal error:|undefined symbol:" build.log | head -n 120 > compile-errors.txt || true
            tail -n 150 build.log > build-tail.txt || true
          fi

      - name: Upload compile error logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compile-error-logs
          path: |
            compile-errors.txt
            build-tail.txt

      - name: Package Image-only AnyKernel3 zip (no dtb, no dtbo)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/README.md AnyKernel3/modules AnyKernel3/patch AnyKernel3/ramdisk

          cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image

          cat << 'EOF' > AnyKernel3/anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=SukiSU-Ultra-KPM-SUSFS-pipa-r1
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=pipa
          device.name2=pipa_pad_cn
          device.name3=23043RP34G
          supported.versions=13-16
          supported.patchlevels=
          '; }

          BLOCK=auto;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF

          test -s AnyKernel3/Image
          test ! -e AnyKernel3/dtb
          test ! -e AnyKernel3/dtbo.img

          cd AnyKernel3
          ZIP_NAME="SukiSU-Ultra-KPM-SUSFS-pipa-r1-AnyKernel3-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../$ZIP_NAME" ./*
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload AnyKernel3 artifact and config audit
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-KPM-SUSFS-pipa-r1-AnyKernel3
          path: |
            ${{ env.ZIP_NAME }}
            config-audit.txt
